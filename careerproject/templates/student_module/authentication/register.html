{% extends 'common/base_public.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card p-5 text-center">

                <h2 class="mb-3">Join Career Assistant</h2>

                <p class="text-muted mb-4">
                    Choose how you want to register.
                </p>

                <div class="d-grid gap-3">

                    <a href="{% url 'student_register' %}" class="btn btn-role">
                        🎓 Register as Student
                    </a>

                    <a href="{% url 'mentor_register' %}" class="btn btn-role">
                        👨‍🏫 Register as Mentor
                    </a>

                    <a href="{% url 'company_register' %}" class="btn btn-role">
                        🏢 Register as Company
                    </a>

                </div>

                <p class="text-center mt-4">
                    Already have an account?
                    <a href="{% url 'login' %}">Login</a>
                </p>

            </div>

        </div>
    </div>
</div>

{% endblock %}
